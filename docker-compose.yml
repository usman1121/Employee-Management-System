services:
  db:
    image: postgres:16-alpine
    container_name: ems-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ep-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: emp1234
    volumes:
      - ems-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ep-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ems-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:emp1234@db:5432/ep-db
    ports:
      - "4001:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ems-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4001
    ports:
      - "3005:3000"
    depends_on:
      - backend

volumes:
  ems-postgres-data:
